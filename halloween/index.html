const chapters=[
{time:'15:00',title:'Пролог',online:22,text:`<p>КуроМур запускает стрим как обычно. Рассказывает, что успела перекусить: картошку с мясом и солёными огурчиками, а после выпила какао с маршмеллоу. Болтает, смеётся. Предлагает поиграть в хоррор игру, которую она долго готовила как сюрприз.</p><div class="chatline"><span class="nick-mod">murov_mur_murovich:</span> ЗАЩИЩАЮ ЧАТ. Мяу-патруль на месте</div><div class="chatline"><span class="nick-vip">ulianaja:</span> Здравствуйте! Куро, ты слишком милая для хоррора.</div><div class="chatline"><span class="nick-vip">nameless_fairy:</span> хоррор? звучит заманчиво</div><div class="chatline"><span class="nick-user">al_murr:</span> Сочник лишь не свежий будет как пустыня. Китайская мудрость</div><div class="chatline"><span class="nick-mod">kuro_jiexa:</span> Звук норм, кошка супер милашка, погнали</div><div class="chatline"><span class="nick-mod">randomyawzer:</span> Здравствуйте ✌️</div><div class="chatline"><span class="nick-vip">artemla_:</span> Смотрю Куромур с кровати, с Акулкой</div><p>Чат в сборе — уже 22 на месте. Куро тянется к чашке и замечает сообщение от ника Kuromur, которого она не писала.</p><div class="chatline mimic"><span class="nick-mim">Kuromur:</span> al_murr, как я тебя ждала! Тыкву за мной видишь? Ответь!</div><p>КуроМур смотрит на сообщение, возможно баг думает она. <i>«Странно, я же ничего не отправляла»</i></p>`},
{time:'15:05',title:'Первые ответы',online:19,text:`<div class="chatline"><span class="nick-user">al_murr:</span> @kuromur вижу, ты очень постаралась для нас.</div><div class="chatline sysline">[Twitch]: Пользователь al_murr не найден.</div><p>В это время КуроМур запускает игру, но на экране появляется ошибка. Ищет крестик, чтобы выйти и перезапустить игру, а его нет.</p><div class="chatline mimic"><span class="nick-mim">Kuromur:</span> l1wka, как думаешь, что это за ошибка?</div><div class="chatline"><span class="nick-user">l1wka:</span> Kuromur, не знаю, впервые вижу.</div><div class="chatline sysline">[Twitch]: Пользователь l1wka не найден.</div><p>Куромур нашла способ перезапустить игру, но выдало ту же ошибку. <i>«Что же делать?»</i> думает она</p><div class="chatline mimic"><span class="nick-mim">Kuromur:</span> Sadfaint, может ты поможешь?</div><div class="chatline"><span class="nick-user">Sadfaint:</span> Kuromur, я раньше не встречался с такой ошибкой. Может стоит перезапустить комп?</div><div class="chatline sysline">[Twitch]: Пользователь Sadfaint не найден.</div><p>КуроМур обращает внимание на чат. Наводит на ник чаттерса — профиль не открывается. Сообщение об удалении так и висит. <i>«Что? Уже третий»,</i> — думает она.</p>`},

});
const len=AC.sampleRate*1.2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(Math.random()<0.001?1:0.015);
const ns=AC.createBufferSource(); ns.buffer=buf; ns.loop=true;
const nf=AC.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=2500;
const ng=AC.createGain(); ng.gain.value=0.05;
ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start(); padNodes.push(ns);
let step=0;
musicTimer=setInterval(()=>{
if(!musicOn) return;
const f=MELODY[step%MELODY.length]; step++;
if(!f) return;
const o=AC.createOscillator(),g=AC.createGain();
o.type='sine';o.frequency.value=f;
const t=AC.currentTime;
g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
o.connect(g);g.connect(master);g.connect(delay);
o.start(t);o.stop(t+1);
},300);
document.getElementById('musicbtn').textContent='🎃 Выключить звук';
document.getElementById('musicbtn').classList.add('on');
AC._master=master;
}
function stopMusic(){
musicOn=false;
clearInterval(musicTimer); musicTimer=null;
padNodes.forEach(n=>{try{n.stop()}catch(e){}}); padNodes=[];
if(AC&&AC._master){try{AC._master.disconnect()}catch(e){}}
document.getElementById('musicbtn').textContent='🎃 Включить звук';
document.getElementById('musicbtn').classList.remove('on');
}
document.getElementById('musicbtn').onclick=()=>{
if(musicOn){stopMusic();return}
musicOn=true; startMusic();
};
/* автозапуск: пытаемся включить сразу; если браузер блокирует — включаем при первом клике/нажатии */
musicOn=true; startMusic();
(function(){
const unlock=()=>{ if(AC&&AC.state==='suspended'){AC.resume()} };
document.addEventListener('click',unlock);
document.addEventListener('keydown',unlock);
document.addEventListener('mousemove',unlock);
})();
</script>
</body>
