<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поздравления на годовщину | kuromursk</title>
  <style>
    :root {
      --bg-deep: #191428;
      --bg-card: #241d38;
      --line: #6d55b8;
      --gold: #e8b84a;
      --gold-soft: #f5d98a;
      --text: #e6e0f2;
      --muted: #a99cc4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background:
        radial-gradient(ellipse 800px 500px at 15% 0%, rgba(109, 85, 184, 0.25), transparent 60%),
        radial-gradient(ellipse 900px 600px at 90% 100%, rgba(232, 184, 74, 0.08), transparent 55%),
        var(--bg-deep);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 3rem 1rem 4rem;
    }

    .wrap { max-width: 820px; margin: 0 auto; }

    header.page-head { text-align: center; margin-bottom: 3rem; }

    header.page-head h1 {
      font-size: clamp(2rem, 6.5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      background: linear-gradient(120deg, var(--gold-soft) 25%, var(--gold) 50%, #b8915c 75%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header.page-head .sub { margin-top: 0.6rem; color: var(--muted); font-size: 1.05rem; font-style: italic; }

    .back-link {
      display: inline-block;
      margin-top: 1.3rem;
      color: var(--gold-soft);
      text-decoration: none;
      border-bottom: 1px dashed var(--gold-soft);
      font-size: 0.95rem;
    }

    .back-link:hover { color: var(--gold); border-bottom-color: var(--gold); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(10, 6, 25, 0.5);
      padding: 1.8rem 2rem;
      margin-bottom: 2.2rem;
      position: relative;
      overflow: hidden;
    }

    /* золотая полоска слева как подпись открытки */
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(var(--gold), transparent);
    }

    .card .title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--gold-soft);
      margin-bottom: 0.9rem;
    }

    .card .text {
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.7;
      font-size: 1.03rem;
    }

    .card img { max-width: 100%; height: auto; display: block; margin: 1.2rem auto 0; border-radius: 6px; }

    .card .likes { margin-top: 1.1rem; font-size: 0.9rem; color: var(--gold); }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a { color: var(--gold-soft); }

    .load-note { text-align: center; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>Поздравления на годовщину 🐾</h1>
      <p class="sub">3 куро-года с Куромур — письмо в 27 частях</p>
      <a class="back-link" href="/">← на главную</a>
    </header>

    <main id="board">
      <p class="load-note">Разворачиваем подарочный пакет…</p>
    </main>

    <footer>
      Архив куро-доски «3 куро-года с Куромур!» • оригинал —
      <a href="https://recocards.com/board/happy-birthday-3-159502659161" target="_blank" rel="noopener">recocards.com</a>
    </footer>
  </div>

  <script>
    fetch("data.json")
      .then(r => r.json())
      .then(cards => {
        const board = document.getElementById("board");
        board.innerHTML = "";
        for (const c of cards) {
          const el = document.createElement("article");
          el.className = "card";
          const title = document.createElement("div");
          title.className = "title";
          title.textContent = c.title || "анонимный поздравивший";
          const text = document.createElement("div");
          text.className = "text";
          text.textContent = c.text || "";
          el.appendChild(title);
          el.appendChild(text);
          for (const src of (c.imgs || [])) {
            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            img.alt = "";
            el.appendChild(img);
          }
          if (c.likes) {
            const likes = document.createElement("div");
            likes.className = "likes";
            likes.textContent = "♥ " + c.likes;
            el.appendChild(likes);
          }
          board.appendChild(el);
        }
      })
      .catch(() => {
        document.getElementById("board").innerHTML =
          "<p class='load-note'>Не удалось развернуть подарки — попробуйте обновить страницу.</p>";
      });
  </script>
</body>
</html>
