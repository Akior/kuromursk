<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kuromursk</title>
  <style>
    :root {
      --bg: #0d0d12;
      --accent: #7c5cff;
      --accent-hover: #977dff;
      --text: #e8e8f0;
      --muted: #8a8a99;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 2rem;
    }

    /* фоновое свечение */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -60%);
      background: radial-gradient(circle, rgba(124, 92, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 1.05rem;
      text-align: center;
    }

    /* --- меню 2026: при наведении раскрываются две кнопки --- */
    .menu-2026 {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
    }

    .menu-2026 .submenu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .menu-2026:hover .submenu,
    .menu-2026:focus-within .submenu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .menu-2026:hover .toggle-btn,
    .menu-2026:focus-within .toggle-btn {
      background: var(--accent-hover);
    }

    .menu-2026 .toggle-btn::after {
      content: "▾";
      font-size: 0.8em;
      margin-left: 0.15em;
    }

    .menu-2026:hover .toggle-btn::after {
      content: "▴";
    }

    .tile-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: var(--accent);
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 24px rgba(124, 92, 255, 0.35);
    }

    .tile-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(124, 92, 255, 0.45);
    }

    .tile-btn svg {
      width: 1.2em;
      height: 1.2em;
      fill: currentColor;
    }

    /* хэллоуин — свой, тыквенный акцент */
    .tile-btn.halloween {
      background: #e8721a;
      box-shadow: 0 4px 24px rgba(232, 114, 26, 0.35);
    }

    .tile-btn.halloween:hover {
      background: #ff8c2e;
      box-shadow: 0 6px 28px rgba(232, 114, 26, 0.45);
    }

    /* страшные истории — багровый акцент */
    .tile-btn.stories {
      background: #8a1f2d;
      box-shadow: 0 4px 24px rgba(138, 31, 45, 0.4);
    }

    .tile-btn.stories:hover {
      background: #b23043;
      box-shadow: 0 6px 28px rgba(138, 31, 45, 0.5);
    }

    footer {
      position: absolute;
      bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>kuromursk</h1>
  <p class="subtitle">Сайт-заглушка — скоро здесь появится что-то интересное</p>

  <div class="menu-2026">
    <button class="tile-btn toggle-btn" type="button" aria-haspopup="true" aria-expanded="false">2026</button>

    <div class="submenu">
      <a class="tile-btn" href="/clips/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
        Клипы
      </a>

      <a class="tile-btn halloween" href="/halloween/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c.5 0 .9.3 1 .8l.6 2.5c2.9.9 5.4 3.1 5.4 5.9 0 .5 0 1-.2 1.5 1.9.5 3.2 1.6 3.2 2.7 0 .6-.5 1.1-1.2 1.4.5.5.8 1 .8 1.5 0 1.4-2.2 2.7-4.8 2.7-1.2 0-2.4-.3-3.3-.7-.4.2-1 .3-1.5.3s-1.1-.1-1.5-.3c-.9.4-2.1.7-3.3.7-2.6 0-4.8-1.3-4.8-2.7 0-.5.3-1 .8-1.5-.7-.3-1.2-.8-1.2-1.4 0-1.1 1.3-2.2 3.2-2.7-.2-.5-.2-1-.2-1.5 0-2.8 2.5-5 5.4-5.9L11 2.8c.1-.5.5-.8 1-.8zm0 9.5c-3.3 0-6 1.9-6 4.2 0 1.9 1.4 3.5 3.4 4-.9-.9-1.4-2-1.4-3.2 0-2.5 2.2-4.5 4-5zm0 0c1.8.5 4 2.5 4 5 0 1.2-.5 2.3-1.4 3.2 2-.5 3.4-2.1 3.4-4 0-2.3-2.7-4.2-6-4.2zM4.5 17.5c1 1.2 2.9 2 5 2h5c2.1 0 4-.8 5-2-1.3-.4-3-.7-5-.7h-5c-2 0-3.7.3-5 .7z"/>
        </svg>
        Хэллоуин
      </a>

      <a class="tile-btn stories" href="/halloweenwords/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 2H6c-1.7 0-3 1.3-3 3v13c0 1.7 1.3 3 3 3h13c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h10v14H6c0-1.1-.9-2-2-2V6c1.1 0 2-.9 2-2zm12 14h-1V4h1v14z"/>
        </svg>
        Страшные истории
      </a>
    </div>
  </div>

  <footer>kuromursk</footer>
</body>
</html>
