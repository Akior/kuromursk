<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kuromursk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,800;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2DEEA;
      --paw: #F8F1F1;
      --panel: #FFFFFF;
      --text: #423534;
      --muted: #757575;
      --line: #D1D1D1;
      --hover-blue: #54ABD1;
      --pink: #E08BBF;
      /* палитра пунктов меню (так как на carrd-странице) */
      --c-clips: #8388EB;       /* лазурный фиолет */
      --c-scary: #F57D07;       /* тыквенный оранж */
      --c-words: #FF6363;       /* алый */
      --c-anniv: #A464A1;       /* пурпурно-розовый */
      --c-info:  #368CC2;       /* голубой */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      /* фирменная плитка кошачьих лапок: чистый безшовный паттерн */
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%20viewBox%3D%220%200%20220%20220%22%3E%3Cg%20fill%3D%22%23F8F1F1%22%20transform%3D%22translate(110%2C110)%20rotate(24)%22%3E%3Cellipse%20cx%3D%220%22%20cy%3D%2218%22%20rx%3D%2238%22%20ry%3D%2231%22%2F%3E%3Cellipse%20cx%3D%22-44%22%20cy%3D%22-26%22%20rx%3D%2215%22%20ry%3D%2219%22%20transform%3D%22rotate(-28%20-44%20-26)%22%2F%3E%3Cellipse%20cx%3D%22-16%22%20cy%3D%22-45%22%20rx%3D%2214%22%20ry%3D%2219%22%20transform%3D%22rotate(-10%20-16%20-45)%22%2F%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%22-45%22%20rx%3D%2214%22%20ry%3D%2219%22%20transform%3D%22rotate(10%2016%20-45)%22%2F%3E%3Cellipse%20cx%3D%2244%22%20cy%3D%22-26%22%20rx%3D%2214.5%22%20ry%3D%2218.5%22%20transform%3D%22rotate(28%2044%20-26)%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
      background-size: 220px;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      padding: 2rem 1rem;
    }

    .inner {
      background: var(--panel);
      border-radius: 0.5rem;
      box-shadow: 0 18px 50px rgba(66, 53, 52, 0.12);
      max-width: 42rem;
      width: 100%;
      padding: 2.875rem 2.25rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .subtitle {
      margin-top: 0.6rem;
      color: var(--pink);
      font-weight: 300;
      font-size: 1.05rem;
      font-style: italic;
    }

    /* ---------- ряд из двух групповых кнопок ---------- */
    .groups {
      margin-top: 2.2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .group { position: relative; }

    /* резервируем место для раскрытого списка внутри карточки */
    .groups { min-height: 13.5rem; }

    /* кнопки в стиле carrd: капсулы, тонкая рамка, uppercase, hover → голубой */
    .gbtn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.72rem 1.5rem;
      font-family: "Montserrat", sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      background: #fff;
      border: solid 1px var(--line);
      border-radius: 0.375rem;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .gbtn::after { content: "▾"; font-size: 0.75em; margin-left: 0.1em; }
    .gbtn:hover { border-color: var(--hover-blue); color: var(--hover-blue); }
    .group:hover .gbtn, .group:focus-within .gbtn { border-color: var(--hover-blue); color: var(--hover-blue); }
    .group:hover .gbtn::after, .group:focus-within .gbtn::after { content: "▴"; }

    ul.submenu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      z-index: 10;
      min-width: 100%;
      width: max-content;
      max-width: 16rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      padding-top: 0.5rem; /* мостик между кнопкой и списком, чтобы ховер не рвался */
    }

    .group:hover ul.submenu, .group:focus-within ul.submenu {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .submenu a {
      display: block;
      padding: 0.62rem 1.25rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text);
      background: #fff;
      border: solid 1px var(--line);
      border-radius: 0.375rem;
      white-space: nowrap;
      overflow: visible;
      transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    /* цветовой отклик каждого пункта */
    .submenu a.i-clips:hover    { border-color: var(--c-clips);  color: var(--c-clips); }
    .submenu a.i-scary:hover    { border-color: var(--c-scary);  color: var(--c-scary); }
    .submenu a.i-words:hover    { border-color: var(--c-words);  color: var(--c-words); }
    .submenu a.i-anniv:hover    { border-color: var(--c-anniv);  color: var(--c-anniv); }
    .submenu a.i-info:hover     { border-color: var(--c-info);   color: var(--c-info); }
    .submenu a.i-twitch:hover   { border-color: var(--hover-blue); color: var(--hover-blue); }

    /* динамическая подпись статуса стрима */
    .twitch-state {
      display: block;
      margin-top: 0.25rem;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
    }

    .twitch-state .dot { font-size: 0.65rem; }

    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 300;
      position: relative;
      z-index: 1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="inner">
    <h1>kuromursk</h1>
    <p class="subtitle">Сборник всего, что происходит в КуроМурске</p>

    <div class="groups">
      <!-- группа 1: 2026 — материалы недавних событий -->
      <div class="group">
        <button class="gbtn" type="button" aria-haspopup="true" aria-expanded="false">2026</button>
        <ul class="submenu">
          <li><a class="i-clips" href="/clips/">Клипы</a></li>
          <li><a class="i-scary" href="/halloween/">Ужастик от Рандомявзеров</a></li>
          <li><a class="i-words" href="/halloweenwords/">Страшные истории</a></li>
          <li><a class="i-anniv" href="/anniversary/">Поздравления на годовщину</a></li>
        </ul>
      </div>

      <!-- группа 2: О КуроМур -->
      <div class="group">
        <button class="gbtn" type="button" aria-haspopup="true" aria-expanded="false">О КуроМур</button>
        <ul class="submenu">
          <li><a class="i-info" href="https://kuromurinfo.carrd.co/" target="_blank" rel="noopener">Контакты</a></li>
          <li>
            <a class="i-twitch" href="https://www.twitch.tv/kuromur" target="_blank" rel="noopener">
              Стримы КуроМур
              <span class="twitch-state" data-channel="kuromur"><span class="dot">⚪</span><span class="lbl">проверяем статус…</span></span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <footer>kuromursk</footer>

  <script>
    // Динамический статус twitch-канала через DecAPI (CORS разрешён, ключи не нужны)
    (function () {
      const el = document.querySelector(".twitch-state");
      if (!el) return;
      const ch = el.dataset.channel || "kuromur";
      const dot = el.querySelector(".dot");
      const lbl = el.querySelector(".lbl");
      const setText = (t) => { if (lbl) lbl.textContent = t; };

      fetch("https://decapi.me/twitch/uptime/" + ch)
        .then(r => r.text())
        .then(txt => {
          if (/is offline/i.test(txt)) {
            dot.textContent = "⚪";
            setText("сейчас офлайн");
          } else {
            dot.textContent = "🟢";
            return fetch("https://decapi.me/twitch/viewercount/" + ch)
              .then(r => r.text())
              .then(v => {
                const n = parseInt(v, 10);
                if (isNaN(n)) return setText("сейчас онлайн");
                const forms = n % 10 === 1 && n % 100 !== 11 ? "зритель"
                  : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? "зрителя"
                  : "зрителей";
                setText("сейчас онлайн · " + n.toLocaleString("ru-RU") + " " + forms);
              });
          }
        })
        .catch(() => {
          dot.textContent = "⚪";
          setText("статус недоступен");
        });
    })();
  </script>
</body>
</html>
